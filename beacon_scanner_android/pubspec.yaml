name: beacon_scanner_gfos_android
description: The Android implementation of beacon_scanner_platform_interface
repository: https://github.com/gfosmbh/beacon_scanner/tree/main/beacon_scanner_android
version: 0.1.1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.35.7"

flutter:
  plugin:
    implements: beacon_scanner
    platforms:
      android:
        package: com.gfos.plugins.beaconscanner
        pluginClass: BeaconScannerPlugin
        dartPluginClass: BeaconScannerAndroid

dependencies:
  flutter:
    sdk: flutter
  beacon_scanner_gfos_platform_interface: 0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
